services:
  mysql:
    image: mysql:8.0
    container_name: petlog-local
    ports:
      - "3308:3306"
    volumes:
      - ./data/mysql/petlog_local:/var/lib/mysql
      - ./data/mysql/config/my.cnf:/etc/mysql/conf.d/my.cnf
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: petlog
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci